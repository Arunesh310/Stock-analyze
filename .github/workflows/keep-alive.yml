name: bharatquant keep-alive & scheduled triggers

# Why this workflow exists
# ------------------------
# The backend runs on Render's free tier, which puts the container to sleep
# after 15 minutes of zero requests. When asleep, the in-process APScheduler
# stops, so the overnight learning cycle (15:40 IST) and pre-market brief
# (08:30 IST) get missed.
#
# This workflow runs entirely on GitHub's free infra and:
#   1. Pings /health every 10 min so Render never sleeps for long.
#   2. Forces the overnight learning cycle at 15:45 IST Mon-Fri as a redundant
#      trigger (in case the in-process scheduler missed it).
#   3. Forces the pre-market brief at 08:35 IST Mon-Fri.
#
# Both triggers are idempotent on the backend — calling them more than once
# just produces a fresh log entry, which is what we want.

on:
  schedule:
    # Keep-alive — every 10 minutes (UTC). GitHub may delay the run on free
    # tier, but 10 min is short enough that Render rarely actually sleeps.
    - cron: "*/10 * * * *"
    # Overnight learning cycle: 15:45 IST = 10:15 UTC, Mon-Fri
    - cron: "15 10 * * 1-5"
    # Pre-market brief: 08:35 IST = 03:05 UTC, Mon-Fri
    - cron: "5 3 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually"
        required: true
        default: "ping"
        type: choice
        options:
          - ping
          - overnight
          - pre_market

concurrency:
  group: bharatquant-cron
  cancel-in-progress: false

env:
  BACKEND: https://bharatquant-backend.onrender.com

jobs:
  ping:
    name: ping backend
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Health check (also wakes Render from sleep)
        run: |
          echo "Pinging $BACKEND/health ..."
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "$BACKEND/health" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/body
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Trigger overnight learning cycle
        if: github.event.schedule == '15 10 * * 1-5' || github.event.inputs.job == 'overnight'
        run: |
          echo "POST $BACKEND/api/overnight/run ..."
          curl -fsS -X POST --max-time 300 "$BACKEND/api/overnight/run" \
            -H "Content-Type: application/json" \
            -o /tmp/overnight.json
          echo "--- response (first 800 chars) ---"
          head -c 800 /tmp/overnight.json
          echo ""

      - name: Trigger pre-market brief
        if: github.event.schedule == '5 3 * * 1-5' || github.event.inputs.job == 'pre_market'
        run: |
          echo "POST $BACKEND/api/pre-market/refresh ..."
          curl -fsS -X POST --max-time 300 "$BACKEND/api/pre-market/refresh" \
            -H "Content-Type: application/json" \
            -o /tmp/premarket.json
          echo "--- response (first 800 chars) ---"
          head -c 800 /tmp/premarket.json
          echo ""
