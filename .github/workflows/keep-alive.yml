name: bharatquant keep-alive

# Why this workflow exists
# ------------------------
# The backend runs on Render's free tier, which puts the container to sleep
# after 15 minutes of zero requests. A short HTTP ping every 10 min keeps
# the container warm so users don't hit a cold start on the first visit.
#
# Heavy work (signal scan, dashboard refresh, overnight cycle, pre-market
# brief, ML retrain) is intentionally NOT triggered against the Render
# backend any more — it lives in `.github/workflows/compute.yml`, which
# runs the Python service code on a beefy GitHub runner and writes
# straight to Neon Postgres. That keeps Render's 512 MB / 0.5 CPU happy.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: bharatquant-keepalive
  cancel-in-progress: true

env:
  BACKEND: https://bharatquant-backend.onrender.com

jobs:
  ping:
    name: ping backend
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Health check (also wakes Render from sleep)
        run: |
          echo "Pinging $BACKEND/health ..."
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 60 "$BACKEND/health" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/body
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 5 attempts"
          exit 1
